# Builds the app and deploys it to GitHub Pages (Settings → Pages → Source: GitHub Actions).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # write: to push the version tag after a successful deploy.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Unit tests
        run: npm test
      # Each deploy is the next patch number after the highest v<major>.<minor>.N
      # tag (major.minor from package.json). The tag is only pushed once the
      # deploy succeeds, so failed or cancelled runs don't use up a number.
      - name: Pick version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          last=$(git ls-remote --tags --refs origin "v$base.*" | sed -E "s#^.*/v$base\.##" | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "version=$base.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
      - name: Build
        run: npm run build
        env:
          # "/<repo>" for a project site; vite.config.ts normalises it.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          APP_VERSION: ${{ steps.version.outputs.version }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Tag the deployed version
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
